services:
  backend:
    build: ./backend
    container_name: argentina_backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: argentina_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend